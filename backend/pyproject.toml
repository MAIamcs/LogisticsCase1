[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "novosibirsk-transport-api"
version = "0.5.0"
description = "Transport planning API with real geography and reproducible synthetic statistical fixtures."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
model = ["catboost==1.2.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
